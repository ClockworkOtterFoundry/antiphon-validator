# Cloudflare Worker config — DEPLOY AT G3-3 ONLY (user present; account is a signup action).
# Steps at launch:
#   1. wrangler kv namespace create WAITLIST   → paste id below
#   2. wrangler kv namespace create EVENTS     → paste id below
#   3. wrangler secret put EXPORT_TOKEN        (long random string; used for /export/* reads)
#   4. set ALLOWED_ORIGIN to the real site origin (e.g. https://antiphon.io)
#   5. wrangler deploy && set site/config.js endpoints to this worker's URL
name = "antiphon-validator-api"
main = "worker.js"
compatibility_date = "2026-07-01"

[vars]
ALLOWED_ORIGIN = "https://validator.clockworkotterfoundry.com"

[[kv_namespaces]]
binding = "WAITLIST"
id = "ddee2b5ebe0746bcaeb7cb5a056e178b"

[[kv_namespaces]]
binding = "EVENTS"
id = "0635e681abc14908b8e099353118565b"
